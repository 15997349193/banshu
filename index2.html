    position: absolute; inset: 0;
    touch-action: none;
    cursor: crosshair;
  }

  /* ---------- 工具栏 ---------- */
  #toolbar {
    position: fixed; top: 50%; left: 18px; transform: translateY(-50%);
    z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: rgba(38, 46, 42, .92);
    backdrop-filter: blur(10px);

    color: #d8e5df;

  .tool-btn .tip {
    position: absolute; left: 62px; top: 50%; transform: translateY(-50%);

<script data-page-node-id="ZBCYy3ZO9IKJmNouxiXSut" data-pnid-children="T7atLubtIFEa2zz0iGEHhb">
(function () {
  "use strict";

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d", { willReadFrequently: false });
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  // ---------- 状态 ----------
  let tool = "pen";              // pencil | pen（圆珠笔）| fountain（钢笔）| eraser
  let color = "#1a1a1a";
  let baseSize = 2;              // 笔触粗细：2 / 4 / 5 三档（竖排），默认最小
  let drawing = false;
  let erased = false;            // 本次笔迹是否动过橡皮擦（决定快照时机）

  // 撤销栈：保存清空前/每次笔画前与橡皮擦启用前的快照
  let undoStack = [];            // 随翻页切换，指向当前页的撤销栈
  const MAX_UNDO = 30;

  // ---------- 翻页（5 页，每页独立保存） ----------
  const PAGE_COUNT = 5;
  let currentPage = 0;
  const pageData = Array.from({ length: PAGE_COUNT }, () => ({ saved: null, undo: [] }));
  const pageIndicator = document.getElementById("page-indicator");
  const btnPrev = document.getElementById("page-prev");
  const btnNext = document.getElementById("page-next");

  // 笔迹平滑状态
  let pts = [];                  // 最近点序列
  let last = null;               // 上一采样点 {x,y,t}
  let vel = 0;                   // 平滑速度
  let width = 1;                 // 当前笔宽

  function snapshot() {
    if (undoStack.length >= MAX_UNDO) undoStack.shift();
    undoStack.push(canvas.toDataURL());
  }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    const img = w > 0 && canvas.width > 0 ? canvas.toDataURL() : null;
    canvas.width = w * DPR;
    canvas.height = h * DPR;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    if (img) {
      const image = new Image();
      image.onload = () => ctx.drawImage(image, 0, 0, w, h);
      image.src = img;
    }
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 工具参数 ----------
  const TOOL_CFG = {
    pencil:  { sizeRatio: 0.8,  velSmooth: 0.4,  maxW: 1.3,  minW: 0.7,  alpha: 0.82 },
    pen:     { sizeRatio: 0.86, velSmooth: 0.5,  maxW: 1.15, minW: 0.85, alpha: 1 },
    fountain:{ sizeRatio: 1.05, velSmooth: 0.45, maxW: 1.4,  minW: 0.7,  alpha: 1 },
    eraser:  { sizeRatio: 2.6,  velSmooth: 0.6,  maxW: 1, minW: 1, alpha: 1 }
  };

  function targetWidth(dt, cfg) {
    // 速度 -> 笔宽：写得快则细，写得慢则粗（书法提按感）
    const v = Math.min(dt === 0 ? 0 : dist(last, cur) / dt, 4); // px/ms 归一
    const t = Math.min(v / 1.2, 1);                            // 0慢 ~ 1快
    const base = baseSize * cfg.sizeRatio;
    return base * (cfg.maxW - (cfg.maxW - cfg.minW) * t);
  }

  // ---------- 绘制核心 ----------
  function strokeSeg(x0, y0, x1, y1, w0, w1, cfg) {
    ctx.save();
    if (tool === "eraser") {
      ctx.globalCompositeOperation = "destination-out";
      ctx.strokeStyle = "rgba(0,0,0,1)";
      ctx.globalAlpha = 1;
    } else {
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = color;
      ctx.globalAlpha = cfg.alpha;
    }
    // 中点二次贝塞尔平滑
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    ctx.beginPath();
    ctx.lineWidth = (w0 + w1) / 2;
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(x0, y0, mx, my);
    ctx.stroke();
    ctx.lineWidth = w1;
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.quadraticCurveTo(x1, y1, x1, y1);
    ctx.stroke();
    ctx.restore();
  }

  function drawDot(x, y, w, cfg) {
    ctx.save();
    if (tool === "eraser") {
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0,0,0,1)";
    } else {
      ctx.fillStyle = color;
      ctx.globalAlpha = cfg.alpha;
    }
    ctx.beginPath();
    ctx.arc(x, y, w / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---------- 指针事件 ----------
  let cur = { x: 0, y: 0 };

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() };
  }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    canvas.setPointerCapture(e.pointerId);
    drawing = true;
    erased = false;
    snapshot(); // 每笔开始前保存，可撤销
    const p = getPos(e);
    last = p;
    cur = p;
    vel = 0;
    width = baseSize * TOOL_CFG[tool].sizeRatio * (tool === "eraser" ? 1 : 1);
    const cfg = TOOL_CFG[tool];
    width = tool === "eraser"
      ? baseSize * cfg.sizeRatio
      : baseSize * cfg.sizeRatio * cfg.minW * 2.2; // 起笔稍收敛
    drawDot(p.x, p.y, width, cfg);
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    const p = getPos(e);
    const cfg = TOOL_CFG[tool];
    const dt = Math.max(p.t - last.t, 1);
    const d = dist(last, p);

    // 忽略极小移动，保证流畅
    if (d < 0.8 && tool !== "eraser") return;

    // 速度平滑 -> 目标笔宽 -> 笔宽平滑（提按过渡自然）
    const target = targetWidth(dt, cfg);
    width += (target - width) * (1 - cfg.velSmooth);

    strokeSeg(last.x, last.y, p.x, p.y, width, width, cfg);

    last = p;
  });

  function endStroke() {
    if (!drawing) return;
    drawing = false;
    // 收笔：轻提
    if (tool !== "eraser" && last) {
      const cfg = TOOL_CFG[tool];
      drawDot(last.x, last.y, Math.max(width * 0.6, 0.5), cfg);
    }
  }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
  canvas.addEventListener("pointerleave", endStroke);

  // ---------- UI 绑定 ----------
  const toolBtns = document.querySelectorAll("[data-tool]");
  function setTool(t) {
    tool = t;
    toolBtns.forEach(b => b.classList.toggle("active", b.dataset.tool === t));
    canvas.style.cursor = t === "eraser"
      ? "cell"
      : "crosshair";
  }
  toolBtns.forEach(b => b.addEventListener("click", () => setTool(b.dataset.tool)));

  const colorDots = document.querySelectorAll(".color-dot");
  colorDots.forEach(d => d.addEventListener("click", () => {
    color = d.dataset.color;
    colorDots.forEach(x => x.classList.toggle("active", x === d));
    if (tool === "eraser") setTool("pen"); // 选色后自动回到书写
  }));

  // 粗细四档
  const sizeDots = document.querySelectorAll(".size-dot");
  sizeDots.forEach(d => d.addEventListener("click", () => {
    baseSize = +d.dataset.size;
    sizeDots.forEach(x => x.classList.toggle("active", x === d));
  }));

  // 撤销
  function undo() {
    if (!undoStack.length) { showToast("没有可撤销的操作"); return; }
    const data = undoStack.pop();
    const img = new Image();
    img.onload = () => {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    };
    img.src = data;
  }
  document.getElementById("btn-undo").addEventListener("click", undo);

  // 一键清空（带确认）
  const confirmBox = document.getElementById("confirm-clear");
  document.getElementById("btn-clear").addEventListener("click", () => {
    confirmBox.style.display = "block";
  });
  document.getElementById("btn-no").addEventListener("click", () => {
    confirmBox.style.display = "none";
  });
  document.getElementById("btn-yes").addEventListener("click", () => {
    confirmBox.style.display = "none";
    snapshot();
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    showToast("板书已清空");
  });

  // 快捷键
  window.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); return; }
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowLeft")  { e.preventDefault(); gotoPage(currentPage - 1); return; }
    if (e.key === "ArrowRight") { e.preventDefault(); gotoPage(currentPage + 1); return; }
    switch (e.key.toLowerCase()) {
      case "b": setTool("pencil"); break;
      case "p": setTool("pen"); break;
      case "f": setTool("fountain"); break;
      case "e": setTool("eraser"); break;
      case "c": document.getElementById("btn-clear").click(); break;
    }
  });

  // toast
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.opacity = 1;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.opacity = 0; }, 1400);
  }

  // ---------- 翻页实现 ----------
  function paintState(state) {
    if (!state) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
      return;
    }
    const img = new Image();
    img.onload = () => {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    };
    img.src = state;
  }

  function updatePager() {
    pageIndicator.textContent = currentPage + 1;
    btnPrev.classList.toggle("disabled", currentPage === 0);
    btnNext.classList.toggle("disabled", currentPage === PAGE_COUNT - 1);
  }

  function gotoPage(n) {
    if (n < 0 || n >= PAGE_COUNT || n === currentPage) return;
    pageData[currentPage].saved = canvas.toDataURL(); // 离开时保存当前页内容
    pageData[currentPage].undo = undoStack;
    currentPage = n;
    undoStack = pageData[n].undo;
    paintState(pageData[n].saved);
    updatePager();
    showToast("第 " + (n + 1) + " 页");
  }

  btnPrev.addEventListener("click", () => gotoPage(currentPage - 1));
  btnNext.addEventListener("click", () => gotoPage(currentPage + 1));
  updatePager();

  // 阻止触摸滚动/缩放
  document.body.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
})();
</script>


</body></html>
